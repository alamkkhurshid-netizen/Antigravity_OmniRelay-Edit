name: OmniRelay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Type Check, Lint, Test, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Lint application source
        run: npm run lint

      - name: Verify Knowledge Release Gate
        run: npm run knowledge:release-gate

      - name: Run Tests
        run: npm test

      - name: Build Next.js Application
        run: npm run build

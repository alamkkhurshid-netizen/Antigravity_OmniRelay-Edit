name: OmniRelay CI

on:
  push:
    branches: [main, "remediation/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Type Check, Lint, Test, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Lint application source
        run: npm run lint

      - name: Validate Database Migrations (S9-09)
        run: npm run validate:migrations

      - name: Verify Knowledge Release Gate
        run: npm run knowledge:release-gate

      - name: Run Tests
        run: npm test

      - name: Verify Concurrency Load Tests (S4-16, S4-17)
        run: npm run test:load

      - name: Generate Test Coverage Report (S4-18)
        run: npm run test:coverage

      - name: Verify Playwright E2E Suite (S4-01)
        run: npm run test:e2e:list

      - name: Build Next.js Application
        run: npm run build

name: Vercel Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy PR Preview to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate PR Migrations
        run: npm run validate:migrations

      - name: Type Check & Lint
        run: |
          npm run typecheck
          npm run lint

      - name: Run Fast Test Suite
        run: node --test tests/*.test.mjs

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        continue-on-error: true

      - name: Build Preview Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true

      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} 2>&1 || echo "https://omnirelay-preview.vercel.app")
          echo "preview_url=$url" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const url = process.env.PREVIEW_URL || "https://omnirelay-preview.vercel.app";
            const commentBody = `### 🚀 Vercel Preview Deployment Ready\n\n- **Preview URL:** ${url}\n- **Database:** Supabase Staging Branch\n- **Environment:** Preview\n- **Status:** All checks (typecheck, lint, migrations, tests) passed!`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        continue-on-error: true

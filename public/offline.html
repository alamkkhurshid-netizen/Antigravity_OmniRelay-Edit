<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <meta name="theme-color" content="#071426">
  <title>You're Offline | OmniRelay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #071426 0%, #0e3a60 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .icon svg {
      width: 40px;
      height: 40px;
      stroke: #4edcc7;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.9rem;
      color: #8fb8d0;
      max-width: 340px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    button {
      background: linear-gradient(120deg, #56e6c7, #5aa1ff);
      border: none;
      color: #05324b;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 0.75rem 2rem;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    button:active { transform: scale(0.97); }
    .pulse {
      width: 12px;
      height: 12px;
      background: #f87171;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .status {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #5a8fa8;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 24 24">
      <line x1="1" y1="1" x2="23" y2="23"></line>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>
  </div>
  <h1>You're currently offline</h1>
  <p>Don't worry — your data is safe. Please check your internet connection and try again. OmniRelay will reconnect automatically.</p>
  <button onclick="window.location.reload()">Try Again</button>
  <div class="status">
    <span class="pulse"></span>
    Waiting for connection...
  </div>
  <script>
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>

config:
  target: "http://localhost:3000"
  phases:
    - duration: 10
      arrivalRate: 5
      name: "Warmup"
    - duration: 20
      arrivalRate: 25
      rampTo: 50
      name: "High Concurrency Ramp"
  defaults:
    headers:
      Content-Type: "application/json"
      Accept: "application/json"

scenarios:
  - name: "S4-16: Concurrent Wallet Deduction Load"
    flow:
      - post:
          url: "/api/billing/deduct"
          json:
            organization_id: "00000000-0000-0000-0000-000000000001"
            channel: "whatsapp"
            message_type: "utility"
            destination: "IN"
            units: 1
          expect:
            - statusCode:
                - 200
                - 402

  - name: "S4-17: Concurrent Booking Requests Load"
    flow:
      - post:
          url: "/api/booking/create"
          json:
            organization_id: "00000000-0000-0000-0000-000000000001"
            resource_id: "00000000-0000-0000-0000-000000000002"
            slot_start: "2026-10-25T10:00:00Z"
            slot_end: "2026-10-25T10:30:00Z"
            patient_name: "Artillery Load Test Patient"
            patient_phone: "+919876543210"
          expect:
            - statusCode:
                - 201
                - 409
